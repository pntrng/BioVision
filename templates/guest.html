<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BioVision 3D – Học tập tương tác</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Permissions Policy để fix lỗi accelerometer -->
  <meta http-equiv="Permissions-Policy" content="accelerometer=*, gyroscope=*, magnetometer=*">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Đảm bảo container viewer có position relative */
    #right {
      position: relative !important;
    }
    
    /* Iframe nằm dưới overlay */
    #api-frame {
      position: relative;
      z-index: 1;
    }
    
    /* Overlay container - QUAN TRỌNG: z-index cao và overflow visible */
    #overlay { 
      position: absolute; 
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none; 
      overflow: visible;
      z-index: 1000;
    }
    
    /* Hotspot - điểm đánh dấu trên mô hình */
    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: rgba(59, 130, 246, 0.8);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1001;
    }
    
    .hotspot.active {
      background: rgba(34, 197, 94, 0.9);
      border-color: #fff;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.6);
      transform: translate(-50%, -50%) scale(1.5);
    }
    
    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.3);
    }
    
    /* Floating label - thông tin hiển thị */
    .floating-label {
      position: absolute;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(249, 250, 251, 0.98) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
      pointer-events: auto;
      cursor: pointer;
      min-width: 120px;
      max-width: 240px;
      z-index: 1002;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: visible;
    }

    /* detail is shown in fixed box, not inside floating labels */
    .floating-label.detail { max-width: 240px; }
    
    .floating-label.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .floating-label.active {
      border-color: rgba(34, 197, 94, 0.5);
      box-shadow: 0 8px 32px rgba(34, 197, 94, 0.25), 0 0 0 1px rgba(34, 197, 94, 0.1);
      background: linear-gradient(135deg, rgba(240, 253, 244, 0.98) 0%, rgba(255, 255, 255, 0.98) 100%);
    }
    
    .label-title {
      font-weight: 700;
      font-size: 13px;
      color: #1e40af;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    
    .floating-label.active .label-title {
      color: #15803d;
    }
    
    .label-content {
      font-size: 11px;
      color: #4b5563;
      line-height: 1.4;
      white-space: normal;
    }

    /* Fixed detail box (top-right) */
    #detailBox {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 380px;
      max-width: calc(100% - 32px);
      max-height: calc(100% - 32px);
      overflow: auto;
      z-index: 1003;
      pointer-events: auto;
    }

    /* Fun fact box (bottom-right) */
    #funFactBox {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 360px;
      max-width: calc(100% - 32px);
      max-height: 40vh;
      overflow: auto;
      z-index: 1003;
      pointer-events: auto;
    }

    .float-in {
      animation: floatIn 220ms ease-out;
    }

    @keyframes floatIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* SVG overlay cho leader lines */
    #svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 999;
    }
    
    .leader-line {
      stroke: rgba(59, 130, 246, 0.6);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: none;
      transition: stroke 0.3s ease;
    }
    
    .leader-line.active {
      stroke: rgba(34, 197, 94, 0.8);
      stroke-width: 2.5;
    }
  </style>

  <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
</head>
<body class="m-0 h-screen flex font-sans bg-gradient-to-br from-gray-50 to-gray-100">
  <!-- Sidebar -->
  <div id="left" class="w-[400px] bg-white border-r-2 border-gray-200 shadow-xl overflow-y-auto">
    <div class="p-8 space-y-6">
      <!-- Logo & Header -->
      <div class="border-b-2 border-gray-100 pb-6">
        <div class="flex items-center space-x-4 mb-3">
          <div class="w-14 h-14 bg-gradient-to-br from-blue-600 via-blue-700 to-blue-800 rounded-2xl flex items-center justify-center shadow-lg">
            <span class="text-white font-bold text-2xl">B</span>
          </div>
          <div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 via-blue-700 to-blue-800 bg-clip-text text-transparent">
              BioVision 3D
            </h1>
            <p class="text-sm text-gray-500 font-medium mt-0.5">Học tập tương tác</p>
          </div>
        </div>
      </div>

      <!-- Search -->
      <div>
        <input 
          id="q" 
          type="text" 
          placeholder="🔍 Tìm kiếm trên toàn thư viện..." 
          class="w-full px-5 py-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-400 transition-all shadow-sm"
        />
      </div>

      <!-- Model Tree -->
      <div>
        <h3 class="text-sm font-bold text-gray-700 mb-4 uppercase tracking-wider">🌳 Cây kiến thức</h3>
        <div id="modelTree" class="space-y-1">
          <!-- Tree view will be inserted here -->
        </div>
      </div>

      <!-- Detail Panel -->
      <div id="panel" class="hidden bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50 border-2 border-pink-200 rounded-2xl p-6 shadow-xl mt-6">
        <h3 id="pTitle" class="text-2xl font-bold text-purple-800 mb-3 border-b-2 border-pink-200 pb-2"></h3>
        <div id="pContent" class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap mb-3"></div>
        <div id="pFunFact" class="hidden mt-4 p-4 bg-yellow-50 border-l-4 border-yellow-400 rounded-lg">
          <div class="text-xs font-semibold text-yellow-800 mb-1">✨ Góc thú vị:</div>
          <div id="pFunFactContent" class="text-sm text-yellow-900"></div>
        </div>
        <div id="pLink" class="hidden mt-4">
          <a id="pLinkBtn" href="#" target="_blank" rel="noopener noreferrer" class="inline-block px-4 py-2 bg-gradient-to-r from-pink-400 to-purple-500 hover:from-pink-500 hover:to-purple-600 text-white rounded-lg text-sm font-medium transition-all shadow-md">
            🔗 Xem chi tiết
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- 3D Viewer -->
  <div id="right" class="flex-1 relative bg-black">
    <iframe id="api-frame" class="w-full h-full border-0" allow="autoplay; fullscreen; xr-spatial-tracking; accelerometer; gyroscope; magnetometer"></iframe>
    <svg id="svg-overlay"></svg>
    <div id="overlay"></div>
    <div id="detailBox" class="hidden bg-white/95 backdrop-blur border-2 border-blue-200 rounded-2xl shadow-2xl">
      <div class="p-4">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-xs font-semibold text-blue-700">🧩 Chi tiết điểm</div>
            <div id="detailTitle" class="mt-1 text-lg font-bold text-gray-900"></div>
          </div>
          <button id="detailClose" class="shrink-0 px-2 py-1 text-xs font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg">✕</button>
        </div>
        <div id="detailContent" class="mt-3 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed"></div>
        <div id="detailLinkWrap" class="hidden mt-4">
          <a id="detailLink" href="#" target="_blank" rel="noopener noreferrer" class="inline-block px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold">
            Mở liên kết
          </a>
        </div>
      </div>
    </div>

    <div id="funFactBox" class="hidden bg-gradient-to-br from-yellow-50 via-amber-50 to-white/95 backdrop-blur border-2 border-yellow-300 rounded-2xl shadow-2xl">
      <div class="p-4">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-xs font-semibold text-yellow-800">✨ Góc thú vị</div>
            <div id="funFactTitle" class="mt-1 text-base font-bold text-gray-900"></div>
          </div>
          <button id="funFactClose" class="shrink-0 px-2 py-1 text-xs font-semibold text-gray-700 hover:text-gray-900 hover:bg-yellow-100 rounded-lg">✕</button>
        </div>
        <div id="funFactContent" class="mt-3 text-sm text-gray-800 whitespace-pre-wrap leading-relaxed"></div>
      </div>
    </div>
  </div>

<script>
  let ALL_DATA = { models: [] };
  let CURRENT_MODEL = null;
  let DATA = { modelUid: "", items: [] };
  let api = null;
  let selectedId = null;
  let animationFrameId = null;
  let lastCameraHash = "";
  let labelElements = new Map(); // itemId -> { element, screenX, screenY }
  let hotspotElements = new Map(); // itemId -> element
  let mindmapOrder = null;
  let expandedGrades = new Set();
  let expandedChapters = new Set();
  let expandedModels = new Set();
  let serverVersion = null;
  let serverUpdatedAt = null;
  const POLL_INTERVAL_MS = 15000; // 15s check for fresh data
  let pollHandle = null;

  const el = (id) => document.getElementById(id);

  // Load mindmap order
  async function loadMindmapOrder() {
    try {
      const response = await fetch('/mindmap_order.json');
      if (response.ok) {
        mindmapOrder = await response.json();
      }
    } catch (e) {
      console.warn('Could not load mindmap_order.json:', e);
    }
  }

  // Sanitize HTML to prevent XSS
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Fetch all data from server
  async function loadAllData() {
    try {
      const response = await fetch(`/api/data?t=${Date.now()}`, {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache' }
      });
      if (!response.ok) throw new Error('Network response was not ok');
      const incoming = await response.json();
      ALL_DATA = incoming;
      
      // Hỗ trợ cả format cũ và mới
      if (ALL_DATA.modelUid && !ALL_DATA.models) {
        ALL_DATA = {
          models: [{
            id: "default",
            grade: "",
            chapter: "",
            modelUid: ALL_DATA.modelUid,
            items: ALL_DATA.items || []
          }]
        };
      }
      
      if (!ALL_DATA.models) ALL_DATA.models = [];
      serverVersion = typeof incoming.version === "number" ? incoming.version : serverVersion || 1;
      serverUpdatedAt = incoming.updatedAt || serverUpdatedAt || "";
      return true;
    } catch (e) {
      console.error('Error loading data:', e);
      const tree = el("modelTree");
      if (tree) {
        tree.innerHTML = `<div class='px-4 py-6 text-center text-sm text-red-500 bg-red-50 border-2 border-red-200 rounded-xl'>Lỗi khi tải dữ liệu: ${escapeHtml(e.message)}</div>`;
      }
      return false;
    }
  }

  function applyLatestData(incoming) {
    if (incoming && incoming.modelUid && !incoming.models) {
      incoming = {
        models: [{
          id: "default",
          grade: "",
          chapter: "",
          modelUid: incoming.modelUid,
          items: incoming.items || []
        }],
        version: incoming.version,
        updatedAt: incoming.updatedAt
      };
    }

    ALL_DATA = incoming && incoming.models ? incoming : { models: [] };
    serverVersion = typeof incoming.version === "number" ? incoming.version : serverVersion;
    serverUpdatedAt = incoming.updatedAt || serverUpdatedAt;

    const prevModelId = CURRENT_MODEL ? CURRENT_MODEL.id : null;
    renderModelTree();

    if (prevModelId) {
      const found = (ALL_DATA.models || []).find(m => m.id === prevModelId);
      if (found) {
        selectModel(found);
      } else {
        CURRENT_MODEL = null;
        selectedId = null;
      }
    }
  }

  async function pollServerData() {
    try {
      const response = await fetch(`/api/data?t=${Date.now()}`, {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache' }
      });
      if (!response.ok) return;
      const incoming = await response.json();
      const incomingVersion = typeof incoming.version === "number" ? incoming.version : null;
      if (incomingVersion === null) return;
      if (serverVersion === null || incomingVersion > serverVersion) {
        applyLatestData(incoming);
        if (CURRENT_MODEL) {
          renderList();
        }
      }
    } catch (e) {
      console.warn('pollServerData error:', e);
    }
  }

  // Render danh sách/overlay (tối thiểu) để tránh lỗi và kích hoạt overlay
  function renderList() {
    // Nếu chưa chọn item nào, mặc định chọn item đầu tiên
    if (!selectedId && (DATA.items || []).length > 0) {
      selectedId = DATA.items[0].id;
    }
    // Cập nhật overlay/leader lines
    updateLabels();
  }


  // Render model tree với cấu trúc Khối lớp → Chương → Mô hình → Thành phần
  function renderModelTree() {
    const q = (el("q").value || "").toLowerCase().trim();
    
    const tree = el("modelTree");
    tree.innerHTML = "";
    
    // Tổ chức dữ liệu theo cấu trúc tree
    const treeData = {};
    ALL_DATA.models.forEach(m => {
      const grade = m.grade || "Khác";
      const chapter = m.chapter || "Khác";
      
      // Filter by search
      const matchSearch = !q || 
        (m.grade && m.grade.toString().includes(q)) ||
        (m.chapter && m.chapter.toLowerCase().includes(q)) ||
        (m.name && m.name.toLowerCase().includes(q)) ||
        ((m.items || []).some(item => 
          (item.name && item.name.toLowerCase().includes(q)) ||
          (item.content && item.content.toLowerCase().includes(q))
        ));
      
      if (!matchSearch) return;
      
      if (!treeData[grade]) treeData[grade] = {};
      if (!treeData[grade][chapter]) treeData[grade][chapter] = [];
      treeData[grade][chapter].push(m);
    });
    
    if (Object.keys(treeData).length === 0) {
      tree.innerHTML = '<div class="px-4 py-6 text-center text-sm text-gray-500 bg-pink-50 border-2 border-pink-200 rounded-xl">Không tìm thấy dữ liệu nào</div>';
      return;
    }
    
    // Sắp xếp grades theo mindmap order
    let grades = Object.keys(treeData);
    if (mindmapOrder && mindmapOrder.grades) {
      grades = grades.sort((a, b) => {
        const idxA = mindmapOrder.grades.indexOf(a);
        const idxB = mindmapOrder.grades.indexOf(b);
        if (idxA === -1 && idxB === -1) return a.localeCompare(b);
        if (idxA === -1) return 1;
        if (idxB === -1) return -1;
        return idxA - idxB;
      });
    } else {
      grades.sort();
    }
    
    grades.forEach(grade => {
      const gradeDiv = createGradeNode(grade, treeData[grade], q);
      tree.appendChild(gradeDiv);
    });
  }
  
  function createGradeNode(grade, chapters, searchQuery) {
    const isExpanded = expandedGrades.has(grade);
    const gradeDiv = document.createElement("div");
    gradeDiv.className = "mb-1";
    
    const gradeHeader = document.createElement("div");
    gradeHeader.className = "flex items-center px-3 py-2 rounded-lg cursor-pointer transition-all hover:bg-pink-100 group";
    gradeHeader.style.backgroundColor = isExpanded ? '#fce7f3' : '#fef3f2';
    
    const icon = document.createElement("span");
    icon.className = "text-lg mr-2 transition-transform";
    icon.textContent = isExpanded ? "📚" : "📖";
    icon.style.transform = isExpanded ? "rotate(0deg)" : "rotate(-90deg)";
    
    const gradeText = document.createElement("span");
    gradeText.className = "font-bold text-sm text-pink-800";
    gradeText.textContent = `Khối ${grade}`;
    
    gradeHeader.appendChild(icon);
    gradeHeader.appendChild(gradeText);
    
    const chaptersContainer = document.createElement("div");
    chaptersContainer.className = "ml-4 mt-1 space-y-1";
    chaptersContainer.style.display = isExpanded ? "block" : "none";
    
    // Sắp xếp chapters theo mindmap order
    let chapterNames = Object.keys(chapters);
    if (mindmapOrder && mindmapOrder.chapters_by_grade && mindmapOrder.chapters_by_grade[grade]) {
      chapterNames = chapterNames.sort((a, b) => {
        const idxA = mindmapOrder.chapters_by_grade[grade].indexOf(a);
        const idxB = mindmapOrder.chapters_by_grade[grade].indexOf(b);
        if (idxA === -1 && idxB === -1) return a.localeCompare(b);
        if (idxA === -1) return 1;
        if (idxB === -1) return -1;
        return idxA - idxB;
      });
    } else {
      chapterNames.sort();
    }
    
    chapterNames.forEach(chapter => {
      const chapterNode = createChapterNode(grade, chapter, chapters[chapter], searchQuery);
      chaptersContainer.appendChild(chapterNode);
    });
    
    gradeHeader.onclick = (e) => {
      e.stopPropagation();
      if (isExpanded) {
        expandedGrades.delete(grade);
      } else {
        expandedGrades.add(grade);
      }
      renderModelTree();
    };
    
    gradeDiv.appendChild(gradeHeader);
    gradeDiv.appendChild(chaptersContainer);
    
    return gradeDiv;
  }
  
  function createChapterNode(grade, chapter, models, searchQuery) {
    const isExpanded = expandedChapters.has(`${grade}::${chapter}`);
    const chapterDiv = document.createElement("div");
    chapterDiv.className = "mb-1";
    
    const chapterHeader = document.createElement("div");
    chapterHeader.className = "flex items-center px-3 py-1.5 rounded-lg cursor-pointer transition-all hover:bg-purple-100 group";
    chapterHeader.style.backgroundColor = isExpanded ? '#f3e8ff' : '#faf5ff';
    
    const icon = document.createElement("span");
    icon.className = "text-sm mr-2";
    icon.textContent = isExpanded ? "📁" : "📂";
    
    const chapterText = document.createElement("span");
    chapterText.className = "font-semibold text-xs text-purple-800";
    chapterText.textContent = escapeHtml(chapter);
    
    chapterHeader.appendChild(icon);
    chapterHeader.appendChild(chapterText);
    
    const modelsContainer = document.createElement("div");
    modelsContainer.className = "ml-4 mt-1 space-y-1";
    modelsContainer.style.display = isExpanded ? "block" : "none";
    
    // Sắp xếp models theo mindmap order
    let sortedModels = [...models];
    if (mindmapOrder && mindmapOrder.models_by_chapter) {
      const key = `${grade}::${chapter}`;
      if (mindmapOrder.models_by_chapter[key]) {
        sortedModels = sortedModels.sort((a, b) => {
          const nameA = a.name || "";
          const nameB = b.name || "";
          const idxA = mindmapOrder.models_by_chapter[key].indexOf(nameA);
          const idxB = mindmapOrder.models_by_chapter[key].indexOf(nameB);
          if (idxA === -1 && idxB === -1) return nameA.localeCompare(nameB);
          if (idxA === -1) return 1;
          if (idxB === -1) return -1;
          return idxA - idxB;
        });
      }
    }
    
    sortedModels.forEach(model => {
      const modelNode = createModelNode(grade, chapter, model, searchQuery);
      modelsContainer.appendChild(modelNode);
    });
    
    chapterHeader.onclick = (e) => {
      e.stopPropagation();
      const key = `${grade}::${chapter}`;
      if (isExpanded) {
        expandedChapters.delete(key);
      } else {
        expandedChapters.add(key);
      }
      renderModelTree();
    };
    
    chapterDiv.appendChild(chapterHeader);
    chapterDiv.appendChild(modelsContainer);
    
    return chapterDiv;
  }
  
  function createModelNode(grade, chapter, model, searchQuery) {
    const isExpanded = expandedModels.has(model.id);
    const isSelected = CURRENT_MODEL && CURRENT_MODEL.id === model.id;
    const modelDiv = document.createElement("div");
    modelDiv.className = "mb-1";
    
    const modelHeader = document.createElement("div");
    modelHeader.className = `flex items-center px-3 py-1.5 rounded-lg cursor-pointer transition-all ${
      isSelected ? "bg-blue-200 border-2 border-blue-400" : "hover:bg-blue-50"
    }`;
    
    const icon = document.createElement("span");
    icon.className = "text-xs mr-2";
    icon.textContent = isExpanded ? "🎯" : "🎨";
    
    const modelText = document.createElement("span");
    modelText.className = `font-medium text-xs ${isSelected ? "text-blue-900" : "text-blue-800"}`;
    modelText.textContent = escapeHtml(model.name || "Mô hình");
    
    const itemsCount = document.createElement("span");
    itemsCount.className = "ml-auto text-xs text-gray-500";
    itemsCount.textContent = `(${(model.items || []).length})`;
    
    modelHeader.appendChild(icon);
    modelHeader.appendChild(modelText);
    modelHeader.appendChild(itemsCount);
    
    const componentsContainer = document.createElement("div");
    componentsContainer.className = "ml-4 mt-1 space-y-0.5";
    componentsContainer.style.display = isExpanded ? "block" : "none";
    
    // Sắp xếp components theo mindmap order
    let items = model.items || [];
    if (mindmapOrder && mindmapOrder.components_by_model) {
      const key = `${grade}::${chapter}::${model.name}`;
      if (mindmapOrder.components_by_model[key]) {
        items = items.sort((a, b) => {
          const nameA = a.name || "";
          const nameB = b.name || "";
          const idxA = mindmapOrder.components_by_model[key].indexOf(nameA);
          const idxB = mindmapOrder.components_by_model[key].indexOf(nameB);
          if (idxA === -1 && idxB === -1) return nameA.localeCompare(nameB);
          if (idxA === -1) return 1;
          if (idxB === -1) return -1;
          return idxA - idxB;
        });
      }
    }
    
    items.forEach(item => {
      const itemNode = createComponentNode(model, item);
      componentsContainer.appendChild(itemNode);
    });
    
    modelHeader.onclick = (e) => {
      e.stopPropagation();
      if (isExpanded) {
        expandedModels.delete(model.id);
        renderModelTree();
      } else {
        expandedModels.add(model.id);
        selectModel(model);
        renderModelTree();
      }
    };
    
    modelDiv.appendChild(modelHeader);
    modelDiv.appendChild(componentsContainer);
    
    return modelDiv;
  }
  
  function createComponentNode(model, item) {
    const isSelected = selectedId === item.id;
    const itemDiv = document.createElement("div");
    itemDiv.className = `px-3 py-1 rounded-md cursor-pointer transition-all text-xs ${
      isSelected ? "bg-yellow-200 border-l-4 border-yellow-500" : "hover:bg-yellow-50"
    }`;
    
    const itemText = document.createElement("span");
    itemText.className = isSelected ? "text-yellow-900 font-medium" : "text-yellow-800";
    itemText.textContent = "• " + escapeHtml(item.name || "Thành phần");
    
    itemDiv.appendChild(itemText);
    
    itemDiv.onclick = (e) => {
      e.stopPropagation();
      selectItem(item);
      // Expand model nếu chưa expand
      if (!expandedModels.has(model.id)) {
        expandedModels.add(model.id);
        renderModelTree();
      }
    };
    
    return itemDiv;
  }

  // Select a model
  function selectModel(model) {
    CURRENT_MODEL = model;
    DATA = {
      modelUid: model.modelUid || "",
      items: model.items || []
    };
    
    // Clear old overlays when switching models
    clearOverlays();
    
    // Hiển thị thông tin mô hình
    setPanel(model, true);
    
    if (DATA.modelUid) {
      initViewer();
    }
    
    // Expand model trong tree
    if (!expandedModels.has(model.id)) {
      expandedModels.add(model.id);
    }
  }

  function clearOverlays() {
    const overlay = el("overlay");
    if (overlay) {
      overlay.innerHTML = "";
    }
    const svg = el("svg-overlay");
    if (svg) {
      svg.innerHTML = "";
    }
    labelElements.clear();
    hotspotElements.clear();
  }

  function setPanel(it, isModel = false) {
    const panel = el("panel");
    if (!it) { 
      panel.classList.add("hidden");
      return; 
    }
    panel.classList.remove("hidden");
    
    if (isModel) {
      // Hiển thị thông tin mô hình
      el("pTitle").textContent = it.name || "Mô hình";
      el("pContent").textContent = it.feature || "Chưa có mô tả đặc điểm.";
      
      const funFactDiv = el("pFunFact");
      const funFactContent = el("pFunFactContent");
      if (it.funFact) {
        funFactDiv.classList.remove("hidden");
        funFactContent.textContent = it.funFact;
      } else {
        funFactDiv.classList.add("hidden");
      }
      
      el("pLink").classList.add("hidden");
    } else {
      // Hiển thị thông tin thành phần
      el("pTitle").textContent = it.name || "Thành phần";
      el("pContent").textContent = it.content || "Chưa có mô tả.";
      
      const funFactDiv = el("pFunFact");
      const funFactContent = el("pFunFactContent");
      if (it.funFact) {
        funFactDiv.classList.remove("hidden");
        funFactContent.textContent = it.funFact;
      } else {
        funFactDiv.classList.add("hidden");
      }
      
      const linkDiv = el("pLink");
      const linkBtn = el("pLinkBtn");
      if (it.link) {
        linkDiv.classList.remove("hidden");
        linkBtn.href = it.link;
      } else {
        linkDiv.classList.add("hidden");
      }
    }
  }

  function selectItem(it) {
    selectedId = it.id;
    if (api && it.cam) {
      api.setCameraLookAt(it.cam.position, it.cam.target, it.cam.duration || 1.2, function(){});
    }
    setPanel(it, false);
    showDetailBox(it);
    showFunFactBox(it);
    updateLabels();
  }

  function showDetailBox(it) {
    const box = el("detailBox");
    if (!box) return;
    if (!it) {
      box.classList.add("hidden");
      return;
    }
    el("detailTitle").textContent = it.name || "Điểm";
    el("detailContent").textContent = it.content || "";

    const linkWrap = el("detailLinkWrap");
    const linkEl = el("detailLink");
    if (it.link) {
      linkWrap.classList.remove("hidden");
      linkEl.href = it.link;
    } else {
      linkWrap.classList.add("hidden");
      linkEl.href = "#";
    }

    // Only show box if there is detail content/funfact/link
    const hasAny = (it.content && it.content.trim()) || (it.link && it.link.trim());
    if (hasAny) {
      box.classList.remove("hidden");
      box.classList.add("float-in");
    } else {
      box.classList.add("hidden");
    }
  }

  function showFunFactBox(it) {
    const box = el("funFactBox");
    if (!box) return;
    if (!it || !it.funFact || !it.funFact.trim()) {
      box.classList.add("hidden");
      return;
    }
    el("funFactTitle").textContent = it.name || "Điểm";
    el("funFactContent").textContent = it.funFact;
    box.classList.remove("hidden");
    box.classList.add("float-in");
  }


  function createFloatingLabel(item, screenX, screenY, existingLabel = null) {
    const overlay = el("overlay");
    if (!overlay) return;
    
    const labelId = `label-${item.id}`;
    
    const label = existingLabel || document.createElement("div");
    label.id = labelId;
    label.className = `floating-label ${item.id === selectedId ? 'active' : ''}`;
    
    const nameText = escapeHtml(item.name || "Bào quan");
    
    label.innerHTML = `
      <div class="label-title">${nameText}</div>
    `;
    
    // Append if new to measure real size
    if (!existingLabel) {
      label.style.opacity = "0";
      overlay.appendChild(label);
    }
    
    const rightContainer = el("right");
    const containerWidth = rightContainer ? rightContainer.offsetWidth : window.innerWidth;
    const containerHeight = rightContainer ? rightContainer.offsetHeight : window.innerHeight;
    const padding = 12;

    const labelWidth = label.offsetWidth || 180;
    const labelHeight = label.offsetHeight || 80;

    // Prefer positioning above/right a bit to avoid covering the part
    let x = screenX + 18;
    if (x + labelWidth + padding > containerWidth) x = screenX - labelWidth - 18;
    let y = screenY - labelHeight - 14;
    if (y < padding) y = screenY + 14;
    if (y < padding) y = padding;
    if (y + labelHeight > containerHeight - padding) {
      y = containerHeight - labelHeight - padding;
    }

    label.style.left = `${x}px`;
    label.style.top = `${y}px`;
    
    label.onclick = (ev) => {
      ev.stopPropagation();
      selectItem(item);
    };
    
    // Update line anchor (center of label)
    labelElements.set(item.id, { element: label, screenX, screenY, labelX: x + labelWidth/2, labelY: y + labelHeight/2 });
    
    if (!existingLabel) {
      requestAnimationFrame(() => label.classList.add("visible"));
    }
    
    return { x: x + labelWidth/2, y: y + labelHeight/2 };
  }

  function updateLeaderLines() {
    const svg = el("svg-overlay");
    const rightContainer = el("right");
    if (!rightContainer || !svg) return;
    
    const rect = rightContainer.getBoundingClientRect();
    svg.setAttribute("width", rect.width);
    svg.setAttribute("height", rect.height);
    
    svg.innerHTML = "";
    
    labelElements.forEach((labelData, itemId) => {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const isActive = itemId === selectedId;
      line.className = `leader-line ${isActive ? 'active' : ''}`;
      
      const { screenX, screenY, labelX, labelY } = labelData;
      const dx = labelX - screenX;
      const dy = labelY - screenY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 5) return;
      
      const midX = screenX + dx * 0.5;
      const midY = screenY + dy * 0.5;
      const controlX = midX + (dy / dist) * 20;
      const controlY = midY - (dx / dist) * 20;
      
      const path = `M ${screenX} ${screenY} Q ${controlX} ${controlY} ${labelX} ${labelY}`;
      line.setAttribute("d", path);
      
      svg.appendChild(line);
    });
  }

  function updateLabels() {
    if (!api) return;
    if (!DATA.items || DATA.items.length === 0) return;
    
    const overlay = el("overlay");
    if (!overlay) return;
    
    const seen = new Set();
    let processedCount = 0;
    const totalItems = DATA.items.length;
    
    (DATA.items || []).forEach(it => {
      if (!it.world) {
        processedCount++;
        return;
      }
      
      api.getWorldToScreenCoordinates(it.world, function(err, screen) {
        processedCount++;
        
        // Sketchfab đôi khi trả kết quả ở tham số "err" dưới dạng object
        // dạng { glCoord: Float64Array(2), canvasCoord: Float64Array(2) }
        // hoặc ở tham số "screen". Ta chuẩn hoá về {x, y} pixel trên canvas.
        let coord = null;

        // Trường hợp chuẩn: screen.x, screen.y là số
        if (screen && typeof screen.x === "number" && typeof screen.y === "number") {
          coord = { x: screen.x, y: screen.y };
        }
        // Trường hợp mới: screen.canvasCoord là mảng [x, y]
        else if (screen && screen.canvasCoord && screen.canvasCoord.length >= 2) {
          coord = { x: screen.canvasCoord[0], y: screen.canvasCoord[1] };
        }
        // Một số phiên bản API trả object vào "err"
        else if (!screen && err && err.canvasCoord && err.canvasCoord.length >= 2) {
          coord = { x: err.canvasCoord[0], y: err.canvasCoord[1] };
        }

        if (!coord) {
          if (processedCount === totalItems) {
            updateLeaderLines();
          }
          return;
        }

        // Bỏ qua các điểm nằm ngoài vùng hiển thị của viewer
        const rightContainer = el("right");
        const boundsWidth = rightContainer ? rightContainer.offsetWidth : window.innerWidth;
        const boundsHeight = rightContainer ? rightContainer.offsetHeight : window.innerHeight;
        if (
          coord.x < 0 || coord.y < 0 ||
          coord.x > boundsWidth || coord.y > boundsHeight
        ) {
          if (processedCount === totalItems) {
            cleanupOverlay(seen);
          }
          return;
        }

        // Hotspot: reuse element instead of appending forever
        let hs = hotspotElements.get(it.id);
        if (!hs) {
          hs = document.createElement("div");
          hs.className = "hotspot";
          hs.onclick = (ev) => {
            ev.stopPropagation();
            selectItem(it);
          };
          overlay.appendChild(hs);
          hotspotElements.set(it.id, hs);
        }
        hs.className = `hotspot ${it.id === selectedId ? "active" : ""}`;
        hs.style.left = coord.x + "px";
        hs.style.top = coord.y + "px";
        hs.title = it.name || "Điểm";

        // Label (name only): reuse element
        const existingLabelEntry = labelElements.get(it.id);
        const existingLabel = existingLabelEntry ? existingLabelEntry.element : null;
        createFloatingLabel(it, coord.x, coord.y, existingLabel);
        seen.add(it.id);
        
        if (processedCount === totalItems) {
          cleanupOverlay(seen);
        }
      });
    });
  }

  function cleanupOverlay(seen) {
    // Remove labels not seen
    const toDeleteLabels = [];
    labelElements.forEach((val, key) => {
      if (!seen.has(key)) {
        if (val.element && val.element.parentNode) {
          val.element.parentNode.removeChild(val.element);
        }
        toDeleteLabels.push(key);
      }
    });
    toDeleteLabels.forEach(k => labelElements.delete(k));

    // Remove hotspots not seen
    const toDeleteHotspots = [];
    hotspotElements.forEach((el, key) => {
      if (!seen.has(key)) {
        if (el && el.parentNode) el.parentNode.removeChild(el);
        toDeleteHotspots.push(key);
      }
    });
    toDeleteHotspots.forEach(k => hotspotElements.delete(k));

    // Disable leader lines for simplicity (less clutter)
    const svg = el("svg-overlay");
    if (svg) svg.innerHTML = "";
  }

  function optimizedRenderLoop() {
    if (!api) {
      animationFrameId = requestAnimationFrame(optimizedRenderLoop);
      return;
    }
    
    api.getCameraLookAt(function(err, cam) {
      if (err) {
        animationFrameId = requestAnimationFrame(optimizedRenderLoop);
        return;
      }
      
      if (cam) {
        const camHash = JSON.stringify([cam.position, cam.target]);
        if (camHash !== lastCameraHash) {
          lastCameraHash = camHash;
          updateLabels();
        }
      }
      
      animationFrameId = requestAnimationFrame(optimizedRenderLoop);
    });
  }

  async function initViewer() {
    if (!DATA.modelUid || DATA.modelUid.trim() === "") {
      const listEl = el("list");
      if (listEl) {
        listEl.innerHTML = "<div class='px-5 py-8 text-center text-sm text-blue-600 bg-blue-50 border-2 border-blue-200 rounded-2xl'><p class='font-semibold mb-2'>Chưa có dữ liệu mô hình</p></div>";
      }
      return;
    }

    clearOverlays();

    const iframe = el("api-frame");
    const client = new Sketchfab(iframe);

    client.init(DATA.modelUid, {
      autostart: 1,
      ui_infos: 0,
      ui_controls: 1,
      success: function(_api) {
        api = _api;
        api.start(function() {
          api.addEventListener("viewerready", function() {
            renderList();
            if ((DATA.items||[]).length > 0) {
              selectItem(DATA.items[0]);
            }
            setTimeout(() => {
              updateLabels();
              optimizedRenderLoop();
            }, 800);
          });
        });
      },
      error: function(err) {
        console.error("Error initializing viewer:", err);
        const listEl = el("list");
        if (listEl) {
          listEl.innerHTML = "<div class='px-4 py-6 text-center text-sm text-red-500 bg-red-50 border-2 border-red-200 rounded-2xl'>Không tải được mô hình. (Model có thể chặn embed/API hoặc mạng lỗi.)</div>";
        }
      }
    });
  }

  // Event listeners
  el("q").addEventListener("input", () => {
    renderModelTree();
    if (CURRENT_MODEL) renderList();
  });
  

  window.addEventListener("resize", () => {
    if (api) {
      setTimeout(updateLabels, 100);
    }
  });

  // Initialize
  loadMindmapOrder().then(() => {
    return loadAllData();
  }).then(() => {
    renderModelTree();
    if (!pollHandle) {
      pollHandle = setInterval(pollServerData, POLL_INTERVAL_MS);
    }
  });

  // Detail box close button
  if (el("detailClose")) {
    el("detailClose").addEventListener("click", (e) => {
      e.stopPropagation();
      const box = el("detailBox");
      if (box) box.classList.add("hidden");
    });
  }

  // Fun fact box close button
  if (el("funFactClose")) {
    el("funFactClose").addEventListener("click", (e) => {
      e.stopPropagation();
      const box = el("funFactBox");
      if (box) box.classList.add("hidden");
    });
  }
  
  // Search input listener
  if (el("q")) {
    el("q").addEventListener("input", renderModelTree);
  }
</script>
</body>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BioVision 3D – Học tập tương tác</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Permissions Policy để fix lỗi accelerometer -->
  <meta http-equiv="Permissions-Policy" content="accelerometer=*, gyroscope=*, magnetometer=*">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Đảm bảo container viewer có position relative */
    #right {
      position: relative !important;
    }
    
    /* Iframe nằm dưới overlay */
    #api-frame {
      position: relative;
      z-index: 1;
    }
    
    /* Overlay container - QUAN TRỌNG: z-index cao và overflow visible */
    #overlay { 
      position: absolute; 
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none; 
      overflow: visible;
      z-index: 1000;
    }
    
    /* Hotspot - điểm đánh dấu trên mô hình */
    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: rgba(59, 130, 246, 0.8);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1001;
    }
    
    .hotspot.active {
      background: rgba(34, 197, 94, 0.9);
      border-color: #fff;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.6);
      transform: translate(-50%, -50%) scale(1.5);
    }
    
    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.3);
    }
    
    /* Floating label - thông tin hiển thị */
    .floating-label {
      position: absolute;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(249, 250, 251, 0.98) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
      pointer-events: auto;
      cursor: pointer;
      min-width: 120px;
      max-width: 200px;
      z-index: 1002;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: visible;
    }
    
    .floating-label.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .floating-label.active {
      border-color: rgba(34, 197, 94, 0.5);
      box-shadow: 0 8px 32px rgba(34, 197, 94, 0.25), 0 0 0 1px rgba(34, 197, 94, 0.1);
      background: linear-gradient(135deg, rgba(240, 253, 244, 0.98) 0%, rgba(255, 255, 255, 0.98) 100%);
    }
    
    .label-title {
      font-weight: 700;
      font-size: 13px;
      color: #1e40af;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    
    .floating-label.active .label-title {
      color: #15803d;
    }
    
    .label-content {
      font-size: 11px;
      color: #4b5563;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    /* SVG overlay cho leader lines */
    #svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 999;
    }
    
    .leader-line {
      stroke: rgba(59, 130, 246, 0.6);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: none;
      transition: stroke 0.3s ease;
    }
    
    .leader-line.active {
      stroke: rgba(34, 197, 94, 0.8);
      stroke-width: 2.5;
    }
  </style>

  <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
</head>
<body class="m-0 h-screen flex font-sans bg-gradient-to-br from-gray-50 to-gray-100">
  <!-- Sidebar -->
  <div id="left" class="w-[400px] bg-white border-r-2 border-gray-200 shadow-xl overflow-y-auto">
    <div class="p-8 space-y-6">
      <!-- Logo & Header -->
      <div class="border-b-2 border-gray-100 pb-6">
        <div class="flex items-center space-x-4 mb-3">
          <div class="w-14 h-14 bg-gradient-to-br from-blue-600 via-blue-700 to-blue-800 rounded-2xl flex items-center justify-center shadow-lg">
            <span class="text-white font-bold text-2xl">B</span>
          </div>
          <div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 via-blue-700 to-blue-800 bg-clip-text text-transparent">
              BioVision 3D
            </h1>
            <p class="text-sm text-gray-500 font-medium mt-0.5">Học tập tương tác</p>
          </div>
        </div>
      </div>

      <!-- Search -->
      <div>
        <input 
          id="q" 
          type="text" 
          placeholder="🔍 Tìm kiếm trên toàn thư viện..." 
          class="w-full px-5 py-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-400 transition-all shadow-sm"
        />
      </div>

      <!-- Grade Filter -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Khối lớp</label>
        <select 
          id="gradeFilter" 
          class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-400"
        >
          <option value="">Tất cả</option>
          <option value="10">Lớp 10</option>
          <option value="11">Lớp 11</option>
          <option value="12">Lớp 12</option>
        </select>
      </div>

      <!-- Chapter Filter -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Chương</label>
        <select 
          id="chapterFilter" 
          class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-4 focus:ring-blue-200 focus:border-blue-400"
        >
          <option value="">Tất cả</option>
        </select>
      </div>

      <!-- Model Tree -->
      <div>
        <h3 class="text-sm font-bold text-gray-700 mb-4 uppercase tracking-wider">Danh sách mô hình</h3>
        <div id="modelTree" class="space-y-2">
          <!-- Model list will be inserted here -->
        </div>
      </div>

      <!-- Organelle List (shown after model selected) -->
      <div id="organelleSection" class="hidden">
        <h3 class="text-sm font-bold text-gray-700 mb-4 uppercase tracking-wider">Danh sách điểm</h3>
        <div id="list" class="space-y-3">
          <!-- Cards will be inserted here -->
        </div>
      </div>

      <!-- Detail Panel -->
      <div id="panel" class="hidden bg-gradient-to-br from-white to-gray-50 border-2 border-blue-200 rounded-2xl p-6 shadow-xl mt-6">
        <h3 id="pTitle" class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-gray-200 pb-3"></h3>
        <div id="pContent" class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap mb-4"></div>
        <div id="pLink" class="hidden">
          <a id="pLinkBtn" href="#" target="_blank" rel="noopener noreferrer" class="inline-block px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">
            🔗 Xem chi tiết
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- 3D Viewer -->
  <div id="right" class="flex-1 relative bg-black">
    <iframe id="api-frame" class="w-full h-full border-0" allow="autoplay; fullscreen; xr-spatial-tracking; accelerometer; gyroscope; magnetometer"></iframe>
    <svg id="svg-overlay"></svg>
    <div id="overlay"></div>
  </div>

<script>
  let ALL_DATA = { models: [] };
  let CURRENT_MODEL = null;
  let DATA = { modelUid: "", items: [] };
  let api = null;
  let selectedId = null;
  let animationFrameId = null;
  let lastCameraHash = "";
  let labelElements = new Map();

  const el = (id) => document.getElementById(id);

  // Sanitize HTML to prevent XSS
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Fetch all data from server
  async function loadAllData() {
    try {
      const response = await fetch('/api/data');
      if (!response.ok) throw new Error('Network response was not ok');
      ALL_DATA = await response.json();
      
      // Hỗ trợ cả format cũ và mới
      if (ALL_DATA.modelUid && !ALL_DATA.models) {
        ALL_DATA = {
          models: [{
            id: "default",
            grade: "",
            chapter: "",
            modelUid: ALL_DATA.modelUid,
            items: ALL_DATA.items || []
          }]
        };
      }
      
      if (!ALL_DATA.models) ALL_DATA.models = [];
      return true;
    } catch (e) {
      console.error('Error loading data:', e);
      const tree = el("modelTree");
      if (tree) {
        tree.innerHTML = `<div class='px-4 py-6 text-center text-sm text-red-500 bg-red-50 border-2 border-red-200 rounded-xl'>Lỗi khi tải dữ liệu: ${escapeHtml(e.message)}</div>`;
      }
      return false;
    }
  }

  // Update chapter filter based on grade
  function updateChapterFilter() {
    const grade = el("gradeFilter").value;
    const chapterSelect = el("chapterFilter");
    const currentValue = chapterSelect.value;
    
    chapterSelect.innerHTML = '<option value="">Tất cả</option>';
    
    if (grade) {
      const chapters = new Set();
      ALL_DATA.models.forEach(m => {
        if (m.grade === grade && m.chapter) {
          chapters.add(m.chapter);
        }
      });
      
      Array.from(chapters).sort().forEach(ch => {
        const option = document.createElement("option");
        option.value = ch;
        option.textContent = escapeHtml(ch);
        chapterSelect.appendChild(option);
      });
    } else {
      const chapters = new Set();
      ALL_DATA.models.forEach(m => {
        if (m.chapter) chapters.add(m.chapter);
      });
      Array.from(chapters).sort().forEach(ch => {
        const option = document.createElement("option");
        option.value = ch;
        option.textContent = escapeHtml(ch);
        chapterSelect.appendChild(option);
      });
    }
    
    chapterSelect.value = currentValue;
    renderModelTree();
  }

  // Render model tree
  function renderModelTree() {
    const q = (el("q").value || "").toLowerCase().trim();
    const grade = el("gradeFilter").value;
    const chapter = el("chapterFilter").value;
    
    const tree = el("modelTree");
    tree.innerHTML = "";
    
    let filteredModels = ALL_DATA.models.filter(m => {
      const matchGrade = !grade || m.grade === grade;
      const matchChapter = !chapter || m.chapter === chapter;
      const matchSearch = !q || 
        (m.grade && m.grade.toString().includes(q)) ||
        (m.chapter && m.chapter.toLowerCase().includes(q)) ||
        (m.modelUid && m.modelUid.toLowerCase().includes(q));
      return matchGrade && matchChapter && matchSearch;
    });
    
    if (filteredModels.length === 0) {
      tree.innerHTML = '<div class="px-4 py-6 text-center text-sm text-gray-500">Không tìm thấy mô hình nào</div>';
      return;
    }
    
    filteredModels.forEach(model => {
      const card = document.createElement("div");
      card.className = `px-4 py-3 bg-white border-2 rounded-xl cursor-pointer transition-all hover:shadow-lg ${
        CURRENT_MODEL && CURRENT_MODEL.id === model.id
          ? "border-blue-500 bg-blue-50"
          : "border-gray-200 hover:border-blue-300"
      }`;
      
      const chapterText = escapeHtml(model.chapter || "Mô hình");
      const gradeText = model.grade ? `Lớp ${model.grade}` : '';
      const itemsCount = (model.items || []).length;
      
      card.innerHTML = `
        <div class="font-semibold text-sm text-gray-800">${chapterText}</div>
        ${gradeText ? `<div class="text-xs text-gray-500 mt-1">${gradeText}</div>` : ''}
        <div class="text-xs text-gray-400 mt-1">${itemsCount} điểm</div>
      `;
      
      card.onclick = () => selectModel(model);
      tree.appendChild(card);
    });
  }

  // Select a model
  function selectModel(model) {
    CURRENT_MODEL = model;
    DATA = {
      modelUid: model.modelUid || "",
      items: model.items || []
    };
    
    el("organelleSection").classList.remove("hidden");
    renderList();
    renderModelTree();
    
    if (DATA.modelUid) {
      initViewer();
    }
  }

  function setPanel(it) {
    const panel = el("panel");
    if (!it) { 
      panel.classList.add("hidden");
      return; 
    }
    panel.classList.remove("hidden");
    el("pTitle").textContent = it.name || "Bào quan";
    el("pContent").textContent = it.content || "";
    
    const linkDiv = el("pLink");
    const linkBtn = el("pLinkBtn");
    if (it.link) {
      linkDiv.classList.remove("hidden");
      linkBtn.href = it.link;
    } else {
      linkDiv.classList.add("hidden");
    }
  }

  function selectItem(it) {
    selectedId = it.id;
    if (api && it.cam) {
      api.setCameraLookAt(it.cam.position, it.cam.target, it.cam.duration || 1.2, function(){});
    }
    setPanel(it);
    renderList();
    updateLabels();
  }

  function renderList() {
    const q = (el("q").value || "").toLowerCase().trim();
    const wrap = el("list");
    wrap.innerHTML = "";
    const items = (DATA.items || []).filter(it => {
      const s = ((it.name||"") + " " + (it.content||"")).toLowerCase();
      return (!q) || s.includes(q);
    });

    if (items.length === 0) {
      const emptyCard = document.createElement("div");
      emptyCard.className = "px-5 py-8 text-center text-sm text-gray-500 bg-gray-50 border-2 border-gray-200 rounded-2xl";
      emptyCard.textContent = "Không tìm thấy điểm nào";
      wrap.appendChild(emptyCard);
      return;
    }

    items.forEach((it, idx) => {
      const isSelected = it.id === selectedId;
      const card = document.createElement("div");
      card.className = `px-5 py-4 bg-white border-2 rounded-2xl cursor-pointer transition-all duration-300 hover:shadow-xl transform hover:-translate-y-1 ${
        isSelected 
          ? "border-blue-500 bg-gradient-to-br from-blue-50 to-blue-100 shadow-xl ring-4 ring-blue-200 scale-[1.02]" 
          : "border-gray-200 hover:border-blue-300 shadow-md"
      }`;
      
      const nameText = escapeHtml(it.name || "Điểm");
      const contentText = it.content ? escapeHtml(it.content) : '';
      
      card.innerHTML = `
        <div class="flex items-start space-x-4">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white text-base font-bold shadow-lg flex-shrink-0">
            ${idx + 1}
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-bold text-lg text-gray-800 mb-1.5">${nameText}</div>
            ${contentText ? `<div class="text-xs text-gray-600 line-clamp-2 leading-relaxed">${contentText}</div>` : ''}
          </div>
        </div>
      `;
      
      card.onclick = () => selectItem(it);
      wrap.appendChild(card);
    });
  }

  function createFloatingLabel(item, screenX, screenY) {
    const overlay = el("overlay");
    if (!overlay) return;
    
    const labelId = `label-${item.id}`;
    const existing = document.getElementById(labelId);
    if (existing) existing.remove();
    
    const label = document.createElement("div");
    label.id = labelId;
    label.className = `floating-label ${item.id === selectedId ? 'active' : ''}`;
    
    const nameText = escapeHtml(item.name || "Bào quan");
    const contentText = item.content ? escapeHtml(item.content) : '';
    
    label.innerHTML = `
      <div class="label-title">${nameText}</div>
      ${contentText ? `<div class="label-content">${contentText}</div>` : ''}
    `;
    
    const labelWidth = 160;
    const labelHeight = 60;
    let x = screenX - labelWidth / 2;
    let y = screenY - labelHeight - 30;
    
    const padding = 10;
    const rightContainer = el("right");
    const containerWidth = rightContainer ? rightContainer.offsetWidth : window.innerWidth;
    const containerHeight = rightContainer ? rightContainer.offsetHeight : window.innerHeight;
    
    if (x < padding) x = padding;
    if (x + labelWidth > containerWidth - padding) x = containerWidth - labelWidth - padding;
    if (y < padding) y = screenY + 30;
    if (y + labelHeight > containerHeight - padding) y = screenY - labelHeight - 30;
    
    label.style.left = x + "px";
    label.style.top = y + "px";
    
    label.onclick = (ev) => {
      ev.stopPropagation();
      selectItem(item);
    };
    
    overlay.appendChild(label);
    labelElements.set(item.id, { element: label, screenX, screenY, labelX: x + labelWidth/2, labelY: y + labelHeight });
    
    setTimeout(() => label.classList.add("visible"), 10);
    
    return { x: x + labelWidth/2, y: y + labelHeight };
  }

  function updateLeaderLines() {
    const svg = el("svg-overlay");
    const rightContainer = el("right");
    if (!rightContainer || !svg) return;
    
    const rect = rightContainer.getBoundingClientRect();
    svg.setAttribute("width", rect.width);
    svg.setAttribute("height", rect.height);
    
    svg.innerHTML = "";
    
    labelElements.forEach((labelData, itemId) => {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const isActive = itemId === selectedId;
      line.className = `leader-line ${isActive ? 'active' : ''}`;
      
      const { screenX, screenY, labelX, labelY } = labelData;
      const dx = labelX - screenX;
      const dy = labelY - screenY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 5) return;
      
      const midX = screenX + dx * 0.5;
      const midY = screenY + dy * 0.5;
      const controlX = midX + (dy / dist) * 20;
      const controlY = midY - (dx / dist) * 20;
      
      const path = `M ${screenX} ${screenY} Q ${controlX} ${controlY} ${labelX} ${labelY}`;
      line.setAttribute("d", path);
      
      svg.appendChild(line);
    });
  }

  function updateLabels() {
    if (!api) return;
    if (!DATA.items || DATA.items.length === 0) return;
    
    const overlay = el("overlay");
    if (!overlay) return;
    
    labelElements.clear();
    overlay.innerHTML = "";
    
    let processedCount = 0;
    let successCount = 0;
    const totalItems = DATA.items.length;
    
    (DATA.items || []).forEach(it => {
      if (!it.world) {
        processedCount++;
        return;
      }
      
      api.getWorldToScreenCoordinates(it.world, function(err, screen) {
        processedCount++;
        
        if (err) {
          if (processedCount === totalItems) {
            updateLeaderLines();
          }
          return;
        }
        
        if (!screen || typeof screen.x !== "number" || typeof screen.y !== "number") {
          if (processedCount === totalItems) {
            updateLeaderLines();
          }
          return;
        }
        
        const hs = document.createElement("div");
        hs.className = `hotspot ${it.id === selectedId ? "active" : ""}`;
        hs.style.left = screen.x + "px";
        hs.style.top = screen.y + "px";
        hs.title = it.name || "Điểm";
        
        hs.onclick = (ev) => {
          ev.stopPropagation();
          selectItem(it);
        };
        
        overlay.appendChild(hs);
        
        createFloatingLabel(it, screen.x, screen.y);
        successCount++;
        
        if (processedCount === totalItems) {
          setTimeout(() => {
            updateLeaderLines();
          }, 50);
        }
      });
    });
  }

  function optimizedRenderLoop() {
    if (!api) {
      animationFrameId = requestAnimationFrame(optimizedRenderLoop);
      return;
    }
    
    api.getCameraLookAt(function(err, cam) {
      if (err) {
        animationFrameId = requestAnimationFrame(optimizedRenderLoop);
        return;
      }
      
      if (cam) {
        const camHash = JSON.stringify([cam.position, cam.target]);
        if (camHash !== lastCameraHash) {
          lastCameraHash = camHash;
          updateLabels();
        }
      }
      
      animationFrameId = requestAnimationFrame(optimizedRenderLoop);
    });
  }

  async function initViewer() {
    if (!DATA.modelUid || DATA.modelUid.trim() === "") {
      const listEl = el("list");
      if (listEl) {
        listEl.innerHTML = "<div class='px-5 py-8 text-center text-sm text-blue-600 bg-blue-50 border-2 border-blue-200 rounded-2xl'><p class='font-semibold mb-2'>Chưa có dữ liệu mô hình</p></div>";
      }
      return;
    }

    const iframe = el("api-frame");
    const client = new Sketchfab(iframe);

    client.init(DATA.modelUid, {
      autostart: 1,
      ui_infos: 0,
      ui_controls: 1,
      success: function(_api) {
        api = _api;
        api.start(function() {
          api.addEventListener("viewerready", function() {
            renderList();
            if ((DATA.items||[]).length > 0) {
              selectItem(DATA.items[0]);
            }
            setTimeout(() => {
              updateLabels();
              optimizedRenderLoop();
            }, 800);
          });
        });
      },
      error: function(err) {
        console.error("Error initializing viewer:", err);
        const listEl = el("list");
        if (listEl) {
          listEl.innerHTML = "<div class='px-4 py-6 text-center text-sm text-red-500 bg-red-50 border-2 border-red-200 rounded-2xl'>Không tải được mô hình. (Model có thể chặn embed/API hoặc mạng lỗi.)</div>";
        }
      }
    });
  }

  // Event listeners
  el("q").addEventListener("input", () => {
    renderModelTree();
    if (CURRENT_MODEL) renderList();
  });
  
  el("gradeFilter").addEventListener("change", updateChapterFilter);
  el("chapterFilter").addEventListener("change", renderModelTree);

  window.addEventListener("resize", () => {
    if (api) {
      setTimeout(updateLabels, 100);
    }
  });

  // Initialize
  loadAllData().then(() => {
    updateChapterFilter();
    renderModelTree();
  });
</script>
</body>
</html>
